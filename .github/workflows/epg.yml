name: Actualizar EPG

on:
  schedule:
    # Se ejecuta automáticamente todos los domingos a las 00:00 hora de Argentina (03:00 UTC)
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón cuando quieras

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correr script conversor
        run: python update_epg.py

      - name: Guardar cambios si hay novedades
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          if git diff --staged --quiet; then
            echo "No hubo cambios en el JSON."
          else
            git commit -m "Actualizacion automatica de EPG"
            git push
          fi
